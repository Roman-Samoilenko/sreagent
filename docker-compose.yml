services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant deliberately ships without curl/wget (security), but
      # does have bash, so use bash's built-in /dev/tcp for a plain TCP
      # reachability check on the REST port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ollama's image is also minimal; use the same TCP-reachability trick.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs once, pulls the embedding model, then exits successfully. Declared
  # as a real dependency of qdrant-mcp (with service_completed_successfully)
  # so `docker compose up -d` alone guarantees the model is present before
  # qdrant-mcp starts serving requests — no separate manual step needed.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: "ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy

  qdrant-mcp:
    build:
      context: ./services/qdrant-mcp
      args:
        QDRANT_MCP_VERSION: v3.3.5
    ports:
      - "3000:3000"
    environment:
      TRANSPORT_MODE: "http"
      HTTP_PORT: "3000"
      QDRANT_URL: "http://qdrant:6333"
      EMBEDDING_PROVIDER: "ollama"
      EMBEDDING_MODEL: "nomic-embed-text"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_HOST: "ollama:11434"
      EMBEDDING_BASE_URL: "http://ollama:11434"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # neo4j:5 does ship wget, but use the same dependency-free TCP check
      # for consistency and to avoid relying on image internals.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/7474' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      CONFIG_PATH: "config/config.docker.yaml"
      QDRANT_MCP_URL: "http://qdrant-mcp:3000/mcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs 
    depends_on:
      qdrant-mcp:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant-data:
  ollama-data:
  neo4j-data:
