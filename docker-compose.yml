services:
  # Основной сервис – планировщик (updater)
  sreagent-updater:
    build:
      context: .
      args:
        APP_CMD: updater
    container_name: sreagent-updater
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - LLM_API_KEY_OPENROUTER=${LLM_API_KEY_OPENROUTER}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_WHITELIST=${TELEGRAM_WHITELIST}
      - TELEGRAM_PASSWORD=${TELEGRAM_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - sreagent-net

  sreagent-bot:
    build:
      context: .
      args:
        APP_CMD: bot
    container_name: sreagent-bot
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - LLM_API_KEY_OPENROUTER=${LLM_API_KEY_OPENROUTER}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_WHITELIST=${TELEGRAM_WHITELIST}
      - TELEGRAM_PASSWORD=${TELEGRAM_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - sreagent-net
    
  qdrant:
    image: qdrant/qdrant:v1.4.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sreagent-net

  neo4j:
    image: neo4j:5.10.0
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - ./neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sreagent-net

networks:
  sreagent-net:
    driver: bridge