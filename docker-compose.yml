version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: "ollama:11434"
    depends_on:
      - ollama
    profiles: ["setup"]

  qdrant-mcp:
    build:
      context: https://github.com/mhalder/qdrant-mcp-server.git
    environment:
      TRANSPORT_MODE: "http"
      HTTP_PORT: "3000"
      EMBEDDING_PROVIDER: "ollama"
      EMBEDDING_MODEL: "nomic-embed-text"
      OLLAMA_URL: "http://ollama:11434"
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "3000:3000"
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      CONFIG_PATH: "config/config.docker.yaml"
      QDRANT_MCP_URL: "http://qdrant-mcp:3000/mcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant-mcp
      - neo4j
    restart: unless-stopped

volumes:
  qdrant-data:
  ollama-data:
  neo4j-data:
